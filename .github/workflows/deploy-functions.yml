name: Deploy Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Create .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          AUTHORIZED_USER_ID: ${{ secrets.AUTHORIZED_USER_ID }}
        run: |
          echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> functions/.env
          echo "TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}" >> functions/.env
          echo "GCS_BUCKET=${GCS_BUCKET}" >> functions/.env
          echo "AUTHORIZED_USER_ID=${AUTHORIZED_USER_ID}" >> functions/.env
          echo "NODE_ENV=production" >> functions/.env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: "firebase-adminsdk-fbsvc@kakebot-972c2.iam.gserviceaccount.com"

      - name: Deploy Functions
        run: npx firebase deploy --only functions --project kakebot-972c2

      - name: Set Telegram Webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        run: |
          curl -s \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${TELEGRAM_WEBHOOK_URL}\"}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"
