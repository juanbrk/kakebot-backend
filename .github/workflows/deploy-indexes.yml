name: Deploy Firestore Indexes

on:
  push:
    branches:
      - main
    paths:
      - "firestore.indexes.json"
  workflow_dispatch:

jobs:
  deploy-indexes:
    name: Deploy Indexes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: "firebase-adminsdk-fbsvc@kakebot-972c2.iam.gserviceaccount.com"

      - name: Deploy Indexes
        run: npx firebase deploy --only firestore:indexes --project kakebot-972c2
