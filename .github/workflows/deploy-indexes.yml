name: Deploy Firestore Indexes

on:
  push:
    branches:
      - main
    # firebase.ci.json y este propio archivo entran al filtro para que el job se revalide
    # solo: si alguien los rompe o los borra, el próximo push a main lo detecta en vez de
    # esperar meses al siguiente cambio de índices.
    paths:
      - "firestore.indexes.json"
      - "firebase.ci.json"
      - ".github/workflows/deploy-indexes.yml"
  workflow_dispatch:

jobs:
  deploy-indexes:
    name: Deploy Indexes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: "firebase-adminsdk-fbsvc@kakebot-972c2.iam.gserviceaccount.com"

      - name: Deploy Indexes
        # firebase.ci.json omite "rules" a propósito: con --only firestore:indexes el CLI igual
        # compila firestore.rules (prepare.js ignora su propio flag context.firestoreRules) y esa
        # llamada requiere firebaserules.rulesets.test, permiso que el service account del WIF no
        # tiene. Sin "rules" en la config no hay compilación. Las rules nunca se deployaron desde
        # acá: deploy.js y release.js sí respetan el flag.
        run: npx firebase deploy --only firestore:indexes --project kakebot-972c2 --config firebase.ci.json
